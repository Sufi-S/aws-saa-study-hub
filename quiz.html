  <link rel="stylesheet" href="assets/css/style.css">

  <style>
    .quiz-container { max-width: 720px; margin: 0 auto; }
    .quiz-counter { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.75rem; }
    .quiz-question h3 { font-size: 1.15rem; font-weight: 600; margin-bottom: 1.25rem; line-height: 1.5; }
    .quiz-options { display: flex; flex-direction: column; gap: 0.6rem; }
    .quiz-option {
      display: flex; align-items: flex-start; gap: 0.75rem;
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: 1rem 1.25rem; cursor: pointer; text-align: left; width: 100%;
      font-size: 0.9rem; color: var(--text-primary); transition: all var(--transition);
      font-family: inherit;
    }
    .quiz-option:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-subtle); }
    .quiz-option.correct { border-color: #22c55e; background: rgba(34,197,94,0.1); }
    .quiz-option.wrong { border-color: #ef4444; background: rgba(239,68,68,0.1); }
    .quiz-option:disabled { cursor: default; }
    .quiz-option-letter {
      width: 28px; height: 28px; border-radius: 50%; background: var(--bg-primary);
      display: flex; align-items: center; justify-content: center; font-weight: 600;
      font-size: 0.8rem; flex-shrink: 0; border: 1px solid var(--border);
    }
    .quiz-explanation {
      background: var(--accent-subtle); border-radius: var(--radius-sm);
      padding: 1rem 1.25rem; margin-top: 1.25rem; font-size: 0.85rem; line-height: 1.6;
      color: var(--text-secondary);
    }
    .quiz-next-btn {
      display: inline-flex; align-items: center; gap: 0.5rem; margin-top: 1.25rem;
      padding: 0.7rem 1.5rem; background: var(--accent); color: #000; border: none;
      border-radius: var(--radius-sm); font-weight: 600; font-size: 0.9rem; cursor: pointer;
      transition: all var(--transition); font-family: inherit;
    }
    .quiz-next-btn:hover { background: var(--accent-hover); }
    .quiz-results { text-align: center; padding: 3rem 0; }
    .quiz-results h3 { font-size: 1.5rem; margin-bottom: 1rem; }
    .quiz-score { font-size: 2.5rem; font-weight: 800; color: var(--accent); margin-bottom: 1.5rem; }
  </style>
</head>
